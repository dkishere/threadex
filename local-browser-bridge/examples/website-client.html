<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Website Bridge Example</title>
    <style>
      :root { color-scheme: dark; font: 15px system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #11151b; color: #f4f7fb; }
      main { width: min(620px, calc(100vw - 48px)); padding: 28px; border: 1px solid #354052; border-radius: 16px; background: #1a202a; }
      h1 { margin: 0 0 10px; } p { color: #afbbcc; line-height: 1.5; }
      .actions { display: flex; gap: 10px; margin: 20px 0; }
      button { padding: 10px 14px; border: 0; border-radius: 8px; background: #4c7dff; color: white; font: inherit; cursor: pointer; }
      button:disabled { opacity: .5; cursor: default; }
      pre { min-height: 90px; overflow: auto; padding: 14px; border-radius: 8px; background: #0e1218; color: #b9d0ff; }
    </style>
  </head>
  <body>
    <main>
      <h1>Website Bridge Example</h1>
      <p>This page asks the Local Browser Bridge extension for <code>tabs.read</code>. The returned tab list must contain only this exact origin.</p>
      <div class="actions"><button id="pair">Request website access</button><button id="tabs" disabled>List same-origin tabs</button></div>
      <pre id="status">Ready.</pre>
    </main>
    <script>
      let sessionToken = "";
      const status = document.querySelector("#status");
      const pair = document.querySelector("#pair");
      const tabs = document.querySelector("#tabs");
      pair.addEventListener("click", async () => {
        pair.disabled = true; status.textContent = "Waiting for the extension-owned approval window…";
        try {
          const response = await fetch("http://127.0.0.1:9327/v1/web/pair", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ scopes: ["tabs.read"] }) });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || typeof payload.token !== "string") throw new Error(payload.error || `Pairing returned HTTP ${response.status}`);
          sessionToken = payload.token; tabs.disabled = false;
          status.textContent = JSON.stringify({ approved: true, scopes: payload.scopes, expiresAt: payload.expiresAt }, null, 2);
        } catch (error) { pair.disabled = false; status.textContent = `Error: ${error instanceof Error ? error.message : String(error)}`; }
      });
      tabs.addEventListener("click", async () => {
        tabs.disabled = true; status.textContent = "Loading same-origin tabs…";
        try {
          const response = await fetch("http://127.0.0.1:9327/v1/web/command", { method: "POST", headers: { "content-type": "application/json", authorization: `Bearer ${sessionToken}` }, body: JSON.stringify({ type: "listTabs" }) });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || payload.ok !== true) throw new Error(payload.error || `Command returned HTTP ${response.status}`);
          status.textContent = JSON.stringify({ command: "listTabs", result: payload.result }, null, 2);
        } catch (error) { status.textContent = `Error: ${error instanceof Error ? error.message : String(error)}`; }
        finally { tabs.disabled = false; }
      });
    </script>
  </body>
</html>
